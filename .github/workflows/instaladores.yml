# Builds the Windows (.msi / .exe) and Linux (.deb / .AppImage) installers.
#
# - merge into main touching the app → next version (highest vX.Y.Z tag, patch + 1) is tagged
#                                      and released with every installer attached
# - push of a tag vX.Y.Z             → release with exactly that version (use it to bump
#                                      major/minor; the automatic bumps continue from it)
# - PR into develop touching the app → tests + build only, nothing is published
name: Instaladores

on:
  push:
    branches: [main]
    tags: ["v*"] # path filters don't apply to tag pushes
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "scripts/**"
      - ".github/workflows/instaladores.yml"
  pull_request:
    branches: [develop]
    paths: # same list as above
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "scripts/**"
      - ".github/workflows/instaladores.yml"

concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cancel a release

jobs:
  versao:
    name: Versão
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the new tag
    outputs:
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags
      - id: v
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [[ -z "$last" ]]; then
              tag="v$(jq -r .version src-tauri/tauri.conf.json)" # first release
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              tag="v$major.$minor.$((patch + 1))"
            fi
            # pushed with GITHUB_TOKEN, so it doesn't start this workflow a second time
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          echo "Versão: $tag"
          { echo "release=true"; echo "tag=$tag"; echo "version=${tag#v}"; } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: versao
    permissions:
      contents: write # upload the installers to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04 # oldest supported glibc → the .deb/.AppImage run on more distros
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev librsvg2-dev pkg-config \
            gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/fetch-ffmpeg.sh

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build (PR, sem publicar)
        if: needs.versao.outputs.release != 'true'
        run: npm run tauri build

      - name: Versão do app = versão da tag
        if: needs.versao.outputs.release == 'true'
        shell: bash
        run: echo '{"version":"${{ needs.versao.outputs.version }}"}' > src-tauri/version.json

      - name: Build + release
        if: needs.versao.outputs.release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.versao.outputs.tag }}
          releaseName: Karaoke Home ${{ needs.versao.outputs.tag }}
          releaseBody: Baixe o instalador do seu sistema em Assets.
          releaseDraft: false
          args: --config src-tauri/version.json
