# Builds the Windows (.msi / .exe) and Linux (.deb / .AppImage) installers.
# - tag v*            → draft GitHub Release with every installer attached
# - manual (Actions)  → installers as downloadable workflow artifacts (for testing, no release)
# - PR touching CI    → same as manual, so pipeline changes get tested before merge
name: Instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/instaladores.yml"
      - "scripts/fetch-ffmpeg.*"
      - "src-tauri/tauri.conf.json"

concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: write # create the draft release on tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04 # oldest supported glibc → the .deb/.AppImage run on more distros
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev librsvg2-dev pkg-config \
            gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/fetch-ffmpeg.sh

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build + release (rascunho)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Karaoke Home ${{ github.ref_name }}
          releaseBody: Baixe o instalador do seu sistema em Assets.
          releaseDraft: true

      - name: Build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build

      - name: Publicar instaladores (artefato)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
