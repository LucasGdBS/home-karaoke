[package]
name = "home-karaoke"
version = "0.1.0"
description = "Karaoke offline para festas em casa"
edition = "2024"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519)
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "net", "sync", "fs", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rustfft = "6"
ort = "=2.0.0-rc.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
